    <meta charset="UTF-8" />

    <meta name="description" content="Clothza — Where designers meet tastemakers. Discover independent fashion boutiques, curate your style, and shop the finest pieces from South Asia's most discerning brands." />
    <meta name="keywords" content="fashion, boutique, Nepal, NPR, style, clothing, accessories, lookbook, style studio" />
    <meta property="og:title" content="Clothza — Where designers meet tastemakers." />

    <meta property="og:type" content="website" />
    <title>Clothza — Where designers meet tastemakers.</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong scheme
      (function () {
        try {
          var saved = localStorage.getItem('clothza_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Playfair Display (editorial serif) + Outfit (modern sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
